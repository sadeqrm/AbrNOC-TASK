apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: abrnoc-platform

  source:
    repoURL: https://github.com/sadeqrm/AbrNOC-TASK.git
    targetRevision: main
    path: gitops/kafka

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
